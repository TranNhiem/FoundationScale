
# NVIDIA GB200 tray: the measured estate hardware.
id: gb200-189gb
gpu_name: NVIDIA GB200
mem_gb: 189
gpus_per_node: 4
bf16_dense_tflops: 1503.4
peak_provenance: measured
interconnect: NVLink intra-tray; IMEX fabric between trays
mfu:
  dense:
    value: 0.318
    provenance: measured
    evidence: "FS MFU campaign 2026-09-22: Gemma-4 E4B DDP b2 ga8, 18,037 tok/s/gpu, 31.8% of measured 1503.4 TF peak"
  # MFU is a property of the CONFIGURATION, not the GPU: the same model measured
  # 31.8% and 4.6% on this hardware. estimate_time picks the nearest point.
  points:
    - config: {sharding: ddp, micro_batch: 2, grad_ckpt: false}
      value: 0.318
      provenance: measured
      evidence: "FS MFU campaign 2026-09-22: Gemma-4 E4B DDP b2 ga8, 18,037 tok/s/gpu"
    - config: {sharding: fsdp, micro_batch: 1, grad_ckpt: true}
      value: 0.046
      provenance: measured
      evidence: "FoundationSkills validation 2026-09-26: Gemma-4 E4B full FT, FSDP x4, b1, grad ckpt, seq 4096; 69.7 model-TF/s/GPU over a 20-step run (short run, not steady state)"
    - config: {sharding: fsdp, micro_batch: 2, grad_ckpt: true, method: lora}
      value: 0.0152
      provenance: measured
      evidence: "FoundationSkills E2E 2026-09-26 (launched by fskills launch): Gemma-4 E4B-it LoRA r16, FSDP x4, b2, grad ckpt, seq 4096; 22.8 model-TF/s/GPU over 30 steps (short run); peak 37.7 GB/GPU vs 32.4 GB planned"
  moe:
    value: 0.016
    provenance: measured
    evidence: "FoundationSkills validation 2026-09-26 (fskills launch, run moe-sft-531c2296): Gemma-4 26B-A4B-it LoRA r32, DDP x4 (FS FSDP cannot wrap this MoE), b2, ga8, grad ckpt, seq 4096; ~1,507 tokens/s/GPU -> 4*N_active*tok/s = 24 TF/s/GPU = 1.6% of 1503.4 (LoRA convention); peak 83.3 GB/GPU vs 94.3 planned. The previous 0.15 was a guess, ~9x optimistic."
scheduler: slurm
# Launch env measured on these trays (estate launcher + FoundationSkills
# validation 2026-09-26): without it FS's fabric probe refused 96 with
# "NCCL invalid usage" on a single-tray srun attach.
env:
  NCCL_MNNVL_ENABLE: "0"
  NCCL_SOCKET_IFNAME: bond0
  GLOO_SOCKET_IFNAME: bond0
  NCCL_NVLS_ENABLE: "1"
cpus_per_task: 30
cluster_rules:
  - "every sbatch has --time=10-00:00:00"
  - "never schedule node r01dgx02: --exclude=r01dgx02"
  - "sbatch preamble must probe the IMEX fabric master (exec 3<>/dev/tcp/master/8081) and abort (exit 96) if refused, because launching while it is refused drains the trays"
  - "slurm commands need a login shell (bash -lc)"
notes:
  - "measured dense bf16 peak 1503.4 TFLOP/s per GPU vs 2500 TFLOP/s datasheet -- always budget against the measured figure"
  - "dense MFU 0.318 was measured for Gemma-4 E4B (dense <=10B); extrapolating to larger dense or any MoE model is derived, not measured"
  - "estimated 4 GPUs per node (tray)"
provenance: null
