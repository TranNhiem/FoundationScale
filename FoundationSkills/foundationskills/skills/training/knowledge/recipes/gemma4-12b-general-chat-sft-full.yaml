
id: gemma4-12b-general-chat-sft-full
version: 1.0.0
title: Gemma-4 12B general-chat SFT (full fine-tune)
index:
  family: gemma4
  size_b: [10.0, 14.0]
  arch: dense
  stage: sft
  goal: general_chat
  domain: any
  method: full
  hardware: [gb200-189gb, h100-80gb]
data:
  format: sft
  min_tokens: null
  recommended_tokens: null
  min_examples: 10000
  recommended_examples: 150000
  mixture:
    general_chat: 0.7
    instruction_mix: 0.3
stages:
  - name: sft-chat-full
    stage: sft
    algorithm: sft
    hparams:
      learning_rate: 1.0e-5
      epochs: 2
    fs:
      entry: foundationscale-train
      args:
        objective: sft
        sharding-strategy: fsdp
        precision: bf16
        optimizer: adamw
        gradient-checkpointing: true
        per-device-batch-size: 2
        gradient-accumulation-steps: 8
        learning-rate: 1.0e-5
        lr-scheduler-type: cosine
        warmup-steps: 100
        max-grad-norm: 1.0
        max-sequence-length: 4096
        save-interval: 500
        logging-steps: 10
        seed: 0
hardware:
  min_gpus: 4
  gpu_mem_gb: 80
  est_gpu_hours: 20.0
evaluation:
  benchmarks:
    - mt_bench
  success: ">= 7.8 MT-Bench single-answer score"
risks:
  - "full-FT of 12B needs ~144GB for weights+grads+optimizer: FSDP over >=4x80GB or 2x189GB"
  - "gemma4-12B is gemma4_unified (vision+audio); FS text training leaves the towers untouched"
  - "FS trains on the full rendered text with NO assistant-only loss masking (measured) -- must be disclosed"
provenance:
  status: literature
  evidence:
    - "Lambert et al. 2024, Tulu 3, arXiv:2411.15124"
  validated_on: null
