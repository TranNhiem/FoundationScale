
id: llama3-8b-manufacturing-sft-lora
version: 1.0.0
title: Llama-3.1-8B manufacturing-domain SFT (LoRA)
index:
  family: llama3
  size_b: [6.0, 10.0]
  arch: dense
  stage: sft
  goal: domain_expert
  domain: manufacturing
  method: lora
  hardware: [gb200-189gb, h100-80gb]
data:
  format: sft
  min_tokens: null
  recommended_tokens: null
  min_examples: 2000
  recommended_examples: 20000
  mixture:
    manufacturing_instructions: 0.7
    general_chat_replay: 0.3
stages:
  - name: sft-manufacturing-lora
    stage: sft
    algorithm: sft
    hparams:
      learning_rate: 1.0e-4
      epochs: 2
      lora_rank: 32
      lora_alpha: 64
    fs:
      entry: foundationscale-train
      args:
        objective: sft
        sharding-strategy: fsdp
        precision: bf16
        optimizer: adamw_torch_fused  # transformers OptimizerNames (measured: "adamw" is refused by transformers 5.13)
        adapter: lora
        adapter-rank: 32
        adapter-alpha: 64
        adapter-dropout: 0.05
        adapter-target: "q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj"
        per-device-batch-size: 4
        gradient-accumulation-steps: 8
        learning-rate: 1.0e-4
        lr-scheduler-type: cosine
        warmup-steps: 100
        max-sequence-length: 4096
        save-interval: 500
        logging-steps: 10
        seed: 0
hardware:
  min_gpus: 1
  gpu_mem_gb: 48
  est_gpu_hours: 6.0
evaluation:
  benchmarks:
    - manufacturing_qa_holdout
  success: ">= +15 points over base on the manufacturing QA holdout; chat template renders exactly"
risks:
  - "FS does not register llama3: --adapter-target is passed explicitly; verify the leaf names match the instantiated modules of this checkpoint"
  - "FS trains on the full rendered text with NO assistant-only loss masking (measured) -- must be disclosed"
  - "LoRA cannot absorb a very large domain shift; if eval flatlines, escalate to full SFT or CPT"
provenance:
  status: literature
  evidence:
    - "Hu et al. 2021, LoRA: Low-Rank Adaptation of Large Language Models, arXiv:2106.09685"
    - "Lambert et al. 2024, Tulu 3, arXiv:2411.15124"
  validated_on: null
