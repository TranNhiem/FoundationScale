
id: gemma4-26b-a4b-code-sft-lora
version: 1.0.0
title: Gemma-4 26B-A4B (MoE) code SFT (LoRA)
index:
  family: gemma4
  size_b: [20.0, 30.0]
  arch: moe
  stage: sft
  goal: code
  domain: code
  method: lora
  hardware: [gb200-189gb]
data:
  format: sft
  min_tokens: null
  recommended_tokens: null
  min_examples: 5000
  recommended_examples: 100000
  mixture:
    code_instructions: 0.7
    code_edits: 0.2
    general_chat_replay: 0.1
stages:
  - name: sft-code-lora
    stage: sft
    algorithm: sft
    hparams:
      learning_rate: 1.0e-4
      epochs: 2
      lora_rank: 32
      lora_alpha: 64
    fs:
      entry: foundationscale-train
      args:
        objective: sft
        sharding-strategy: ddp  # FS FSDP cannot wrap Gemma-4 MoE layers (measured 2026-09-26)
        precision: bf16
        optimizer: adamw_torch_fused  # transformers OptimizerNames (measured: "adamw" is refused by transformers 5.13)
        gradient-checkpointing: true
        adapter: lora
        adapter-rank: 32
        adapter-alpha: 64
        adapter-dropout: 0.05
        per-device-batch-size: 2
        gradient-accumulation-steps: 8
        learning-rate: 1.0e-4
        lr-scheduler-type: cosine
        warmup-steps: 100
        max-sequence-length: 4096
        save-interval: 500
        logging-steps: 10
        seed: 0
hardware:
  min_gpus: 2
  gpu_mem_gb: 80
  est_gpu_hours: 12.0
evaluation:
  benchmarks:
    - humanevalplus
    - mbpp_plus
  success: ">= +10 points pass@1 over base on HumanEval+ with MBPP+ not regressing"
risks:
  - "MoE routing is not adapter-wrapped: LoRA only tunes dense projections -- watch for expert-underuse collapse on narrow code sets"
  - "128 experts x 8 active: memory estimate must use size_b (not active_b) for weights, active_b for compute"
provenance:
  status: validated
  evidence:
    - "hyperparameters: Tulu 3 (arXiv:2411.15124) LoRA SFT practice"
    - "FoundationSkills validation 2026-09-26: planned, emitted and launched by fskills launch on 4x GB200 (DDP; FS FSDP fails on this MoE), 20 steps; FS save gates 4/4 PASS; peak 83.3 GB/GPU vs 94.3 GB planned; ~1,507 tokens/s/GPU"
    - "SCOPE: runs correctly on FoundationScale; code-benchmark quality NOT yet measured"
  validated_on:
    fs_commit: 3f4cf029f1cdc2abc03846d1d0eba234b9f5b2c1
    hardware: gb200-189gb
    run_id: moe-sft-531c2296
    date: "2026-09-26"
    run_manifest: /home/hhri-ai/hh28144/Project-Developments/FoundationScale/runs/fskills_validation/train_moe/moe-sft/run_manifest.json
