
id: gemma4-e4b-general-chat-sft-lora
version: 1.0.0
title: Gemma-4 E4B general-chat SFT (LoRA)
index:
  family: gemma4
  size_b: [3.0, 10.0]
  arch: dense
  stage: sft
  goal: general_chat
  domain: any
  method: lora
  hardware: [gb200-189gb]
data:
  format: sft
  min_tokens: null
  recommended_tokens: null
  min_examples: 5000
  recommended_examples: 80000
  mixture:
    general_chat: 0.8
    instruction_mix: 0.2
stages:
  - name: sft-chat-lora
    stage: sft
    algorithm: sft
    hparams:
      learning_rate: 1.0e-4
      epochs: 2
      lora_rank: 16
      lora_alpha: 32
    fs:
      entry: foundationscale-train
      args:
        objective: sft
        sharding-strategy: fsdp
        precision: bf16
        optimizer: adamw_torch_fused  # transformers OptimizerNames (measured: "adamw" is refused by transformers 5.13)
        adapter: lora
        adapter-rank: 16
        adapter-alpha: 32
        adapter-dropout: 0.05
        per-device-batch-size: 4
        gradient-accumulation-steps: 8
        learning-rate: 1.0e-4
        lr-scheduler-type: cosine
        warmup-steps: 100
        max-sequence-length: 4096
        save-interval: 500
        logging-steps: 10
        seed: 0
hardware:
  min_gpus: 1
  gpu_mem_gb: 48
  est_gpu_hours: 5.0
evaluation:
  benchmarks:
    - mt_bench
  success: ">= 6.5 MT-Bench single-answer score; <|turn>model template round-trips"
risks:
  - "E4B base has NO chat_template file (measured): render with the family template explicitly via the format op"
  - "FS chooses LoRA targets automatically for gemma4 (registered family): vision/audio towers are correctly excluded"
provenance:
  status: validated
  evidence:
    - "Tulu 3, arXiv:2411.15124 (hyperparameter source)"
    - "FoundationSkills validation 2026-09-26: planned by training.planner, emitted by training.emit and launched by fskills launch with this exact configuration (30 steps); FS save gates 4/4 PASS; peak 75.9 GB/GPU; 55.0 model-TF/s/GPU (MFU 3.7% measured by FS)"
    - "SCOPE: runs correctly and reproducibly on FoundationScale; benchmark quality (MT-Bench) NOT yet measured"
  validated_on:
    fs_commit: f4643a7b6169efa6ebeec678d75827a3020c3966
    hardware: gb200-189gb
    run_id: recipe-sft-3df648c2
    date: "2026-09-26"
