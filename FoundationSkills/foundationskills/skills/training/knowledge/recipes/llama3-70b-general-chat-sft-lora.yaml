
id: llama3-70b-general-chat-sft-lora
version: 1.0.0
title: Llama-3.1-70B general-chat SFT (LoRA, sharded)
index:
  family: llama3
  size_b: [60.0, 80.0]
  arch: dense
  stage: sft
  goal: general_chat
  domain: any
  method: lora
  hardware: [gb200-189gb, h100-80gb]
data:
  format: sft
  min_tokens: null
  recommended_tokens: null
  min_examples: 10000
  recommended_examples: 100000
  mixture:
    general_chat: 0.6
    instruction_mix: 0.4
stages:
  - name: sft-chat-lora
    stage: sft
    algorithm: sft
    hparams:
      learning_rate: 1.0e-4
      epochs: 2
      lora_rank: 32
      lora_alpha: 64
    fs:
      entry: foundationscale-train
      args:
        objective: sft
        sharding-strategy: fsdp
        precision: bf16
        optimizer: adamw_torch_fused  # transformers OptimizerNames (measured: "adamw" is refused by transformers 5.13)
        gradient-checkpointing: true
        adapter: lora
        adapter-rank: 32
        adapter-alpha: 64
        adapter-dropout: 0.05
        adapter-target: "q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj"
        per-device-batch-size: 2
        gradient-accumulation-steps: 16
        learning-rate: 1.0e-4
        lr-scheduler-type: cosine
        warmup-steps: 100
        max-sequence-length: 4096
        save-interval: 500
        logging-steps: 10
        seed: 0
hardware:
  min_gpus: 4
  gpu_mem_gb: 80
  est_gpu_hours: 24.0
evaluation:
  benchmarks:
    - mt_bench
  success: ">= 7.5 MT-Bench single-answer score"
risks:
  - "FS does not register llama3: --adapter-target is passed explicitly; verify leaf names against the checkpoint"
  - "frozen bf16 weights alone are ~141GB: FSDP-shard even for LoRA"
  - "FS trains on the full rendered text with NO assistant-only loss masking (measured) -- must be disclosed"
provenance:
  status: literature
  evidence:
    - "Hu et al. 2021, LoRA, arXiv:2106.09685"
    - "Lambert et al. 2024, Tulu 3, arXiv:2411.15124"
  validated_on: null
