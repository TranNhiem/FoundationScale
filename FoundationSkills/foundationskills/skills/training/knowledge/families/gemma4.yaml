tokenizer:
  vocab_size: 262144
  bos: <bos>
  eos: <eos>
  pad: <pad>
chat_template:
  source: tokenizer
  family_tag: gemma4
  # Measured from the real gemma-4-E4B-it chat_template (2026-09-26); Gemma-4
  # uses <|turn>/<turn|>, NOT the Gemma-2/3 <start_of_turn> markers.
  assistant_marker: "<|turn>model"
  generation_prompt: "<|turn>model\n"
  thinking: "enable_thinking=True renders a '<|turn>system\n<|think|>\n<turn|>' prefix; a reasoning trace goes in '<|channel>thought\n...\n<channel|>' after '<|turn>model\n' (the template renders it only on tool-call turns -- the Data Engine injects and verifies it)"
  notes: >-
    The -it variants ship a chat_template.jinja (has_chat_template_file=true).
    Measured: the gemma-4-12B and gemma-4-E4B BASE checkpoints carry no chat
    template file, so SFT on those needs the Data Engine builtin renderer or an
    explicit template.
special_tokens:
  bos: <bos>
  eos: <eos>
  pad: <pad>
  turn_open: <|turn>
  turn_close: <turn|>
  think: <|think|>
  channel_open: <|channel>
  channel_close: <channel|>
lora_targets:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
quirks:
  - >-
    MEASURED 2026-09-26 on the real templates: gemma-4-26b-it and gemma-4-31b-it
    generation prompts (thinking off) end with an EMPTY thought block
    '<|turn>model\n<|channel>thought\n<channel|>'; E4B's does not. A plain training
    render lacks it, so SFT targets must carry the same prefix. The Data Engine
    aligns this per tokenizer (DE-RDY-011); FoxBrain SFT_OFFICIAL_V3 records the
    same v2->v3 fix on 4,183 no-think rows.
  - >-
    The stock template's strip_thinking() deletes <|channel>...<channel|> from
    assistant content and renders thinking only on tool-call turns, so a reasoning
    trace vanishes silently; the Data Engine injects and verifies it.
  - >-
    FS FSDP fails on gemma-4-26B-A4B ('Could not find the transformer layer class
    to wrap', measured); FoxBrain traced the MoE block to a plain nn.Module. The
    planner uses DDP for this variant.
  - >-
    gemma-4-31B (config-verified): dense (enable_moe_block=false), 60 layers,
    hidden 5376, 32 q / 16 kv heads but only 4 global kv heads (so tensor
    parallelism is capped at 4), attention_k_eq_v=true (full-attention layers
    have no separate v_proj), final_logit_softcapping=30, tied embeddings. The
    softcap materialises full fp32 logits (seq x 262144 x 4 B = 16 GiB at 16K per
    sequence), which the estimator's logits term covers.
  - >-
    End-of-turn supervision matters: FoxBrain's 26B SFT without the terminating
    <turn|> (id 106) supervised never learned to stop. FS's full-sequence loss
    trains on the rendered '<turn|>' after each answer, so this holds by
    construction here.
  - >-
    Measured on gemma-4-31B: the vision tower carries {q,k,v,o,gate,up,down}_proj
    as Gemma4ClippableLinear subclasses, which FS 'type(m) is Linear' adapter
    targeting rejects; FS scopes adapters to model.language_model and excludes
    model.vision_tower / model.audio_tower / model.embed_vision. A tower-blind
    leaf-name matcher would crash in peft.
  - >-
    Interleaved attention (layer_types): sliding-window attention with window
    1024 (512 on E4B) alternates with full_attention layers.
  - >-
    Logit softcapping: Gemma-family models traditionally softcap attention/final
    logits (e.g. attn_logit_softcapping, final_logit_softcapping); verify against
    the actual modeling code before assuming untied-transformer logit behaviour.
  - >-
    E4B per-layer embeddings (PLE): hidden_size_per_layer_input=256 with
    vocab_size_per_layer_input=262144 inflates total params to ~8B while the
    compute tower is ~4B; use active_b (not size_b) for FLOP estimates on E4B.
  - >-
    Tied word embeddings across all variants (tie_word_embeddings=true); the
    embed tokens cost is amortised but weight tying interacts with adapter
    freezing -- verify adapters never target the embed/lm_head.
  - >-
    Tokenizer model_max_length is a sentinel (~1e30), not a context limit; rely
    on each variant's context_length (max_position_embeddings) instead.
provenance:
  status: literature
  evidence:
    - local config.json
    - local safetensors byte size
    - FS family registry (foundationscale.families.registry) for tower scoping
  validated_on: null
