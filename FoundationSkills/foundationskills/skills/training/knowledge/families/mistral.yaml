tokenizer:
  vocab_size: 32768
  bos: <s>
  eos: </s>
  pad: null
chat_template:
  source: tokenizer
  family_tag: mistral
  assistant_marker: "[/INST]"
  generation_prompt: null
  notes: >-
    Mistral Instruct uses [INST]...[/INST] markers, not role/chat-node turns;
    the tokenizer template (v0.3) must be used or SFT rendering breaks.
special_tokens:
  bos: <s>
  eos: </s>
lora_targets:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
quirks:
  - >-
    FS does not register this family: pass --adapter-target explicitly; FS
    refuses automatic LoRA targeting (foundationscale.families.registry knows
    only gemma4 and qwen3.5).
  - "Mixtral vocab (32000) differs from Mistral-7B v0.3 (32768); tokenizer.vocab_size above follows Mistral-7B v0.3."
  - "Mistral-7B v0.1 used sliding-window attention (window 4096); v0.3 removed it. Verify the window setting per checkpoint before long-context runs."
provenance:
  status: literature
  evidence:
    - Mistral AI model cards / config.json (mistralai/*)
  validated_on: null
