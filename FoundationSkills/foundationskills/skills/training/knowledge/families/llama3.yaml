tokenizer:
  vocab_size: 128256
  bos: <|begin_of_text|>
  eos: <|eot_id|>
  pad: null
chat_template:
  source: tokenizer
  family_tag: llama3
  assistant_marker: <|start_header_id|>assistant<|end_header_id|>
  generation_prompt: "<|start_header_id|>assistant<|end_header_id|>\n\n"
  notes: >-
    The Instruct variants carry the Llama-3 header/turn template in
    tokenizer_config (source tokenizer). Base checkpoints carry none; the
    format op must render with this template explicitly.
special_tokens:
  begin_of_text: <|begin_of_text|>
  end_of_text: <|end_of_text|>
  start_header_id: <|start_header_id|>
  end_header_id: <|end_header_id|>
  eot_id: <|eot_id|>
lora_targets:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
quirks:
  - >-
    FS does not register this family: pass --adapter-target explicitly; FS
    refuses automatic LoRA targeting (foundationscale.families.registry knows
    only gemma4 and qwen3.5).
  - >-
    RoPE frequency base changed between Llama 3 and 3.1 (long-context scaling);
    do not mix configs when resuming training across variants.
  - "GQA with kv_heads 8 on all listed variants."
provenance:
  status: literature
  evidence:
    - Llama 3 model cards / config.json (meta-llama/Meta-Llama-3.1-*)
  validated_on: null
