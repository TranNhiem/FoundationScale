
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundationskills"
version = "0.1.0"
description = "Agent-facing skills layer on top of FoundationScale"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
data = ["datasets>=2.18", "pyarrow>=14"]
tokenize = ["transformers>=4.45"]
dedup = ["datasketch>=1.6"]
langid = ["fasttext-wheel>=0.9.2"]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
docs = ["docling>=2"]
html = ["resiliparse>=0.14"]
pipeline = ["datatrove>=0.3"]
test = ["pytest>=8"]

[project.scripts]
fskills = "foundationskills.cli:main"
fskills-rl = "foundationskills.interfaces.fs.rl_driver:main"

[tool.setuptools]
packages = { find = { where = ["."], include = ["foundationskills*"] } }

[tool.setuptools.package-data]
foundationskills = ["schemas/**/*.json", "**/*.yaml", "**/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: slow or deep FoundationScale probes",
  "gpu: tests requiring GPU hardware",
]
