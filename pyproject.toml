[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundationscale"
version = "0.1.0"
description = "A scalable distributed training framework for foundation models, from single-GPU experiments to large-scale multi-node training."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["distributed-training", "checkpointing", "verification", "foundation-models"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
# CORE RUNTIME DEPENDENCIES: NONE — deliberately.
#
# The gate contract (foundationscale.gates.core) is pure stdlib so that the
# verification plane runs on a login node with nothing installed. The audited
# estate's truncated export (5.94 GB of a required 51.6 GB, rc=0) shipped
# precisely because its byte check lived in a script on a box that had the right
# environment, and was absent from the box that ran the export. A verifier that
# needs a fat environment is a verifier that does not run.
#
# Heavy dependencies are therefore optional extras. The reference/verified
# environment is torch 2.10.0+cpu on Python 3.12; lower bounds below are the
# minimum supported, not the tested pin.
dependencies = []

[project.optional-dependencies]
checkpoint = [
    "torch>=2.1",
    "safetensors>=0.4",
    # safetensors does NOT declare numpy, but `safetensors.torch` imports it at
    # module load. A developer machine almost always has numpy pulled in by
    # something else, so the omission is invisible locally; the first clean CI
    # runner collapsed 9 tests with ModuleNotFoundError. Declared here rather
    # than left to luck — an undeclared dependency is the same class of defect
    # as the one that made this CI green without torch, differing only in that
    # it fails loudly. FS_FORBID_SKIPS is what keeps it loud.
    "numpy>=1.24",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.7",
]
train = [
    # The training entry point (`foundationscale.train`) owns no nn.Module of its
    # own: it validates the declared topology and profile, hands the step to
    # `transformers.Trainer`, and runs the save gates on the result. These three
    # are what that delegation costs, and they enter the process ONLY inside
    # train/loop.py's guarded import — the package itself stays torch-free.
    #
    # This extra existed as a COMMENT in train/cli.py's docstring for one release
    # and as a real extra in nothing. `loop.py` prints `pip install
    # 'foundationscale[train]'` as the remedy on its missing-dependency refusal,
    # so the one operator guaranteed to run it was the one it could not help
    # (#224). checks/packaging_reachability.py is what keeps that from recurring.
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.18",
    # transformers does NOT declare accelerate, but `Trainer` requires it and
    # raises ImportError from inside TrainingArguments.__post_init__ -- long
    # after the guarded import in train/loop.py has already succeeded. Same
    # shape as the numpy/safetensors note above, and found the same way: by
    # RUNNING the path rather than by reading the imports.
    #
    # Worth stating plainly, because it is #224 recursing. That finding was
    # "packaging shipped as a docstring". Its fix declared the three modules
    # loop.py names in an import statement -- and was still wrong, because a
    # dependency list written by reading source is a claim, and only executing
    # the path measures it. The first real train() run found two more (#225).
    "accelerate>=1.1",
]
all = [
    # `all` must mean all, or it is a name that lies. CI does NOT install this —
    # it pins .[checkpoint,dev] precisely so transformers stays absent and
    # train()'s guarded-import refusal path is exercised on a host without it.
    "foundationscale[checkpoint,dev,train]",
]

[project.urls]
Homepage = "https://github.com/TranNhiem/FoundationScale"
Repository = "https://github.com/TranNhiem/FoundationScale"

[project.scripts]
# CI runs this as a separate job (see .github/workflows/ci.yml). It executes every
# registered gate's controls and fails the build if any MUST_FIRE control does not
# block — or if the registry is empty, which is the vacuous pass one level up.
foundationscale-controls = "foundationscale.gates.controls:main"
# argparse in train/cli.py sets prog="foundationscale-train", so --help and
# --version have always told the operator to run this name. Until #224 it was
# registered nowhere, and the only working invocation was
# `python -m foundationscale.train.cli`. Two tests asserted the STRING appeared
# in the output; neither asked the packaging system whether the name resolved.
foundationscale-train = "foundationscale.train.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running checks (large synthetic checkpoints on disk)",
    "integration: exercises a full lifecycle path end to end",
]

# #228. CI asked for the two adjudicating tools/ modules by PATH
# (`--cov=tools/live_save_gate.py`). coverage.py reads a `source` entry as a
# package or directory NAME, so it never resolved either one: both emitted
# `CoverageWarning: Module tools/live_save_gate.py was never imported
# (module-not-imported)` and contributed zero rows, while the comment above the
# CI step said they were measured. A widening that never widened.
#
# `--cov=tools` is the form that resolves, and coverage keys by FILE, which
# matters here: the suite reaches these two under six different module names
# (`tools.live_save_gate`, `live_save_gate`, `live_save_gate_under_control`, and
# the emitter's three), and only path-keying collapses those into one number.
#
# omit carries the six helpers that are NOT adjudicators, stated with their
# denominator rather than left silent. Measured 2026-09-03 under the resolving
# form: countables_census 0%, count_census_modules 0%,
# census_denominator_control 0% (the #66 gap), preflight 80.93%, mutate 87.30%,
# real_checkpoint_probe 90.80%. Including them takes the total 93.53% -> 86.24%,
# and the remedy for that is putting them under test, never lowering the floor.
# A NEW tools/*.py is deliberately not omitted: it enrols at 0% and drags the
# total red, which is the fail-closed direction.
#
# preflight is the one PACKAGE in this list. Its entry was the literal path
# `tools/preflight.py`, which stopped matching the moment the module became
# tools/preflight/*.py — omit entries are paths, not names, so the split would
# have silently ENROLLED 22 files at preflight's 80.93% and moved the floor
# under cover of a refactor. The two patterns below restore exactly the old
# scope (the same code, now in more files). Stating the cost rather than
# leaving it silent: unlike the literal entries above, these also swallow a
# FUTURE tools/preflight/**.py, so the fail-closed default the paragraph above
# describes does not hold inside this one subtree. What replaces it is that
# every module here is reached by tests/tooling/test_preflight.py's 21 contracts and by
# `--self-test`'s 18 MUST_FIRE / 10 MUST_PASS lanes, which is a stronger
# instrument than an enrolment number.
[tool.coverage.run]
omit = [
    "tools/census_denominator_control.py",
    "tools/count_census_modules.py",
    "tools/countables_census.py",
    "tools/mutate.py",
    "tools/preflight/*.py",
    "tools/preflight/**/*.py",
    "tools/real_checkpoint_probe.py",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "ARG", "PTH"]
# UP038 (non-pep604-isinstance) was deprecated and then removed upstream, so
# whether it fires is a property of the linter binary rather than of this
# source tree. MEASURED 2026-08-30: the same commit is clean under ruff 0.16.4
# and reports 21 UP038 violations under ruff 0.9.10 — the version shipped in
# the H100 estate's `nemo-automodel-26-04.sif`. A gate whose verdict depends on
# which machine ran it states no coverage, which is the defect #83 fixed for
# the gates' own interpreter; this line fixes the same defect for the linter.
# Ignoring it makes both toolchains agree. Modern ruff warns that the code is
# removed and exits 0, which is the intended outcome: the warning is the
# audit trail. Deliberately NOT fixed by rewriting the 21 call sites — they sit
# in mutation-battery target modules, and editing anchored text to satisfy a
# retired lint rule would confound the battery's attribution for no gain.
ignore = ["UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]
# The ten preflight checks are dispatched through one uniform signature
# `(cfg, s, env, shared, registry=None)` so `_execute` can call any of them
# without knowing which; a check that reads no corpus still receives `env`.
# That makes an unused PARAMETER a property of the dispatch contract rather than
# a defect at any one site, which is why this is scoped here instead of repeated
# as ten inline noqas. Scoped to ARG001 deliberately: ARG002 (unused method
# argument) and ARG005 (unused lambda argument) still fire in this file, and so
# does F841 — an unused LOCAL is the shape that hid a dropped knob in
# tools/live_save_gate.py, and nothing here should silence it.
# Keyed to the package, not the old single file: `tools/preflight.py` matches
# nothing after the split, and the ten dispatched checks now live under
# tools/preflight/items/, one directory deeper.
"tools/preflight/**/*.py" = ["ARG001"]

[tool.mypy]
# tools/ is on the path, not merely checked. Several test modules and the
# launcher plane import the tools/ scripts as top-level siblings, and without
# this mypy reports import-not-found. Silencing THAT with ignore_missing_imports
# is the exact failure the comment below describes, so the siblings are made to
# resolve instead.
#
# This used to read "live_save_gate imports its sibling real_checkpoint_probe".
# That dependency ran the wrong way and finding #219 inverted it: the decision
# machinery lives in foundationscale.gates.probe, and tools/real_checkpoint_probe.py
# is now the thin CLI that imports the package. No library module reaches into
# tools/ any more -- which is the property that lets the package decide from a
# wheel, where [tool.setuptools.packages.find] where = ["src"] means tools/ is
# not installed at all.
mypy_path = ["src", "tools"]
python_version = "3.10"
# The package ships strict; sloppy types in gate code are how an all([]) sneaks in.
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
# NOT set globally. Torch and friends ship incomplete stubs, but a blanket
# ignore_missing_imports also silences an unresolvable FIRST-PARTY import — it hid a
# 928-line module whose `from ..core import ...` pointed at a package that does not
# exist, so the module could not be imported at all while mypy reported success. Scope
# the exemption to the third-party names that actually need it.
[[tool.mypy.overrides]]
# transformers/datasets join torch here for the same reason: they are OPTIONAL
# extras (foundationscale[train]), absent in CI by design, and reached only
# inside train/loop.py's guarded import. Listed BY NAME, never globally -- a
# blanket ignore_missing_imports is what once hid a broken first-party import.
module = ["torch.*", "safetensors.*", "transformers.*", "datasets.*"]
ignore_missing_imports = true

# numpy needs more than ignore_missing_imports: it SHIPS stubs, and the problem is
# parsing them. python_version is pinned to 3.10 above so our own code is checked
# against the oldest Python this package supports — but the matrix also runs 3.12,
# where pip resolves a numpy whose .pyi files use `type X = ...` statements. mypy
# then reports "Type statement is only supported in Python 3.12 and greater" inside
# numpy/__init__.pyi and stops before checking anything of ours: a typecheck step
# that fails for a reason unrelated to this repository, or worse, one that a future
# `|| true` would turn into a step that checks nothing at all.
#
# follow_imports = "skip" makes numpy an opaque Any at the boundary. We import it
# nowhere; it arrives only because safetensors.torch does. Nothing of ours loses
# coverage, and the pinned python_version keeps doing its job.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
# follow_imports alone is not enough and the reason is easy to lose: mypy does not
# apply it to .pyi files, and numpy's problem IS its .pyi. follow_imports_for_stubs
# extends the skip to stubs, which is the only combination that keeps the parse from
# happening at all.
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# preflight is not type-clean yet: 23 errors measured 2026-08-31 (11 missing-annotation,
# 12 substantive — several are `x >= None` comparisons, which is precisely the class only
# a type checker finds). It is exempted so the REST of tools/ can be checked at all,
# because the alternative on offer was checking none of it: `mypy src` left the live
# emitter and the live gate unchecked, and that is how a 3-tuple annotation sat over a
# 4-tuple return (#105) with the suite green. The exemption is stated WITH its
# denominator rather than left silent — a quiet exclusion reads exactly like coverage.
# Delete this block when the 23 land; do not grow it to cover a new file.
#
# Four patterns for ONE exemption, because the module split changed the name
# mypy knows this code by. `tools/preflight.py` resolved as `preflight` (mypy_path
# carries tools/); `tools/preflight/` resolves as a package, and mypy reports it
# under `tools.preflight.*`. The single-name override matched nothing afterwards
# and 49 errors appeared with no code change — the same shape as the coverage
# `omit` entry above, and the reason both are listed here rather than assumed.
# The bare names are kept so the exemption survives either resolution.
[[tool.mypy.overrides]]
module = ["preflight", "preflight.*", "tools.preflight", "tools.preflight.*"]
ignore_errors = true
