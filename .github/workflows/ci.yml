# Four jobs, on purpose.
#
# `check` is ordinary hygiene: lint, format, types, tests across supported Pythons.
#
# `controls` is the job this framework exists for. It runs every registered gate's
# fixtures — each MUST_FIRE control is a deliberately defective input, e.g. the
# 128-experts-aliased-to-16 checkpoint, and the build fails if the gate does not
# block on it. That is how a gate is prevented from rotting into a no-op that
# reports success on everything, which the audit watched a verification tool do
# (all_identity: True over an empty tensor set — all([]) is True).
# The entry point also exits nonzero if the registry is empty: a controls run
# that verified nothing is the same vacuous pass one level up.
#
# `launchers` closes finding #81: launchers/test_launcher_contracts.sh carries
# 134 controls and was invoked by no CI step — a suite that only runs when a
# human remembers is a control that never RUNS, which is to say not a control.
# The job runs it from the repository root (measured CWD-sensitivity: called
# from inside launchers/, its watchdog sub-suite reports "0/8 launcher
# unreadable" and fails closed) and credits a pass only on the suite's own
# summary line showing zero failures over the measured denominator — an exit
# code alone cannot tell 134 green controls from a run that died before its
# tally. The summary verifier itself gets MUST_FIRE legs: three doctored logs
# must be refused before the real one is trusted. A bash -n sweep over every
# *.sh under launchers/ gates syntax first and fails on zero matched files,
# because a sweep that found nothing is unmeasured, not clean.
#
# `mutation` runs tools/mutate.py: the test suite is executed against
# systematically mutated sources, and any mutant the suite does not kill fails
# the job. It is deliberately NOT part of `check` — it is slower (~2 min) and it
# asks a different question: `check` asks "does the code pass the suite",
# mutation asks "does the suite detect wrong code". It runs on every push;
# whether branch protection gates merges on it is a repo setting, not something
# this file controls. What this file guarantees is that it runs and that a
# survivor turns it red.
#
# The skip-hole fix, recorded so it stays fixed
# ---------------------------------------------
# Measured at the time it was found: with torch the suite was 387 passed / 3
# xfailed; without torch, 346 passed / 41 skipped / 3 xfailed — and this
# workflow, installing only .[dev], reported green. The 41 skips were the tests
# that write a real
# checkpoint to disk and read it back, including the bridge test that reproduces
# the incident this repository publishes. A check that could not fail bought
# confidence anyway. The fix has four parts:
#
#   1. `check` installs .[checkpoint,dev] — torch present, nothing can skip for
#      lack of a dependency. The matrix stays at 3.10/3.11/3.12; nothing was
#      dropped (see the matrix comment).
#   2. FS_FORBID_SKIPS=1 is set job-wide and tests/conftest.py turns any skip
#      into a failure that names the test and its reason. Job-wide on purpose:
#      the probe step must see the same arming the pytest step sees.
#   3. A MUST_FIRE probe for the guard itself: CI generates a deliberately
#      skipped test and requires the armed guard to fail the run AND name the
#      probe. Same discipline `controls` applies to gates, one level up.
#   4. A coverage floor (--cov-fail-under=90) so the next mechanism for
#      silently shrinking what the suite exercises also shows up red.
#
# The tree is now 412 passed / 0 skipped / 0 xfailed with torch. The numbers
# above are kept as the measurement that motivated the fix, not as current
# state — dating a claim is cheaper than re-deriving why it was made.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    name: "lint / typecheck / test (Python ${{ matrix.python }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # torch publishes linux-x86_64 wheels for all three of these (on PyPI and
        # on the pytorch CPU index), so installing [checkpoint] costs the matrix
        # nothing. If a future Python or runner lacks a torch wheel, the matrix
        # must change out loud — never by letting the tests skip: the guard below
        # fails that build now.
        python: ["3.10", "3.11", "3.12"]
    env:
      # Job-wide on purpose. The probe step and the pytest step must share ONE
      # arming: if this ever moves into a single step's `env:`, the probe can
      # pass while the suite runs disarmed — the vacuous pass, one level up.
      # tests/conftest.py treats exactly "1" as armed; a laptop leaves it unset.
      FS_FORBID_SKIPS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        # .[checkpoint] provides torch (+ safetensors): without it 41 tests skip
        # and this job used to report green anyway. The pytorch CPU wheel index
        # keeps the torch download small; PyPI stays the primary index for
        # everything else. pytest-cov is installed here because pyproject.toml's
        # [dev] extra does not carry it and the pytest step needs --cov.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[checkpoint,dev]" "pytest-cov>=5" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Skip-guard probe (MUST_FIRE — prove the armed guard can fail)
        # The cheapest honest proof that FS_FORBID_SKIPS is wired: hand the
        # runner a test that cannot pass-skipped-unnoticed and require (a) a
        # nonzero exit and (b) the guard's summary naming this exact test. (a)
        # alone would pass on any unrelated crash, hiding a dead guard; (b)
        # alone says nothing about the exit code. The probe file is generated
        # here, never committed, and removed by trap — and if the trap ever
        # fails, its skip fails the armed suite below: fail closed both ways.
        run: |
          cat > tests/test__skip_guard_probe.py <<'PROBE'
          """Throwaway MUST_FIRE probe for the FS_FORBID_SKIPS guard (tests/conftest.py).

          Generated in CI's probe step and deleted by the same step. If this file ever
          survives into the real suite run, the armed guard fails the build on its skip:
          fail closed in both directions.
          """

          import pytest


          def test_skip_guard_probe():
              pytest.skip("deliberate skip; an armed skip guard must fail this run")
          PROBE
          trap 'rm -f tests/test__skip_guard_probe.py' EXIT
          set +e
          output=$(pytest tests/test__skip_guard_probe.py 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -eq 0 ]; then
            echo "::error::FS_FORBID_SKIPS is armed job-wide, yet a deliberately skipped"
            echo "::error::test exited 0. The guard in tests/conftest.py is missing or"
            echo "::error::has rotted into a no-op — the vacuous pass, one level up."
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -q "test_skip_guard_probe"; then
            echo "::error::The probe run failed, but the skip guard did not name the"
            echo "::error::probe. Something else failed it — the guard may be a no-op"
            echo "::error::hidden behind an unrelated failure. Investigate before merging."
            exit 1
          fi
          echo "skip guard fired and named its probe — the guard is proven able to fail."
      - name: Ruff
        # tools/ is included: the mutation runner is the thing that decides
        # whether the suite is trustworthy, so it is not exempt from the checks
        # the suite is held to. checks/ is included for the same reason and was
        # added by #231 -- the standing legs below (WF-YAML, BASH-LC) and the
        # packaging gate all live there, so it held three of this workflow's own
        # controls while being the one directory no linter read.
        run: ruff check src tests tools checks
      - name: Ruff format
        run: ruff format --check src tests tools checks
      - name: Mypy
        # The two LIVE tools are checked, for the same reason Ruff checks tools/ above:
        # `mypy src` left the emitter and the gate unchecked, and that is exactly how
        # _declared_fqns_from_base carried a 3-tuple annotation over a 4-tuple return
        # (#105) with the whole suite green -- mypy names it twice, at the return and
        # at the 4-way unpack, so this step is the control that defect never had.
        # Named individually rather than as `tools`: tools/__init__.py makes the dir a
        # package while live_save_gate imports its sibling script-style, so the same
        # file resolves under two module names and mypy refuses the directory. The
        # remaining tools/ modules are unchecked -- stated, not implied.
        # checks/ is likewise unchecked here, with its denominator on the wire:
        # 3 of 3 files, 10 errors (5 no-untyped-def, 1 missing types-PyYAML stub,
        # 2 deliberate back-compat shapes in packaging_reachability.py). Ruff now
        # covers checks/ (#231); mypy is the tracked remainder.
        run: mypy src tools/emit_run_manifest.py tools/live_save_gate.py tools/real_checkpoint_probe.py
      - name: Pytest (coverage floor 90; skips are failures — FS_FORBID_SKIPS)
        # --cov-fail-under=90 against a measured 93.6% total. The floor was 70 when
        # written, sized around gates/fixtures.py at 63% and gates/controls.py at
        # 0%; both now sit at 98% and 97%, so 70 had become a floor nothing could
        # touch — a gate that cannot fail, in the file that argues against them.
        # 90 leaves ~3.6 points of headroom and still goes red on the collapse
        # cases this defends: a new unexercised module, a quietly emptied test
        # file, tests no longer collected.
        #
        # It is a TOTAL, and a total can be subsidised: the weakest module is
        # checkpoint/dcp_meta.py at 72%, which this floor would not catch on its
        # own. Named in the README under Status rather than left implicit.
        #
        # #85: the floor now also measures the two tools/ modules that
        # ADJUDICATE — tools/live_save_gate.py (adjudicates the first real
        # save) and tools/emit_run_manifest.py (refuses dishonest
        # emissions) — which sat outside the measured denominator while
        # the total read as though it covered them. Scoped per-file
        # because tools/ is not an importable package: a blanket
        # --cov=tools would drag every non-adjudicating helper in at ~0%
        # and read below the floor, and the remedy for that is putting
        # code under test, never lowering 90. The rest of tools/ stays
        # OUT of the claim. The first combined total for the widened
        # denominator is produced by this job's next run; whatever it
        # prints is the measurement, and a red there is a correct red,
        # not a re-floor prompt.
        run: pytest --cov=foundationscale --cov=tools/live_save_gate.py --cov=tools/emit_run_manifest.py --cov-report=term-missing --cov-fail-under=90

  controls:
    name: gate controls (MUST_FIRE fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # [checkpoint], not just [dev] -- and this is the SAME lesson the `check`
        # job and the Makefile's `install` target already learned, landing in a
        # third place it was never applied (the #230 class: a fix that reached
        # some of its sites).
        #
        # MEASURED: this job has failed on every run since the weight-parity
        # controls landed. In one Python 3.12 venv, `.[dev]` gives exit 1 with
        # four `checkpoint.weight_parity` fixtures raising ModuleNotFoundError
        # and the gate reporting "0 of 1 MUST_PASS control(s) reached PASS";
        # adding [checkpoint] to that same venv gives exit 0, 10/10 gates. Only
        # the extra differed, so the extra is the cause.
        #
        # Note WHICH way it failed, because it is the good direction: torch's
        # absence did not quietly shrink the denominator to the nine gates that
        # do not need it. #56's rule fired -- every healthy fixture for that gate
        # abstained, so healthy-input behaviour was verified zero times, and a
        # gate proven only able to block is unproven in the direction that gets
        # gates disabled. The machinery was right; this job's environment was
        # not. Do not "fix" this by relaxing the gate.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[checkpoint,dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run gate controls
        run: python -m foundationscale.gates.controls

      # Packaging reachability (#224). Runs in THIS job because it is the only
      # one that both installs the distribution and installs nothing heavy: the
      # gate must be able to distinguish "the target does not resolve" from
      # "the target needs an optional extra this host does not have", and a job
      # with [train] installed could never exercise the second.
      #
      # --self-test FIRST and as a separate step. If the controls do not behave
      # the real verdict is worthless, and a combined step would let a broken
      # detector report CLEAR over the repository. Both steps are load-bearing:
      # the second is the measurement, the first is the licence to believe it.
      - name: Packaging reachability controls (MUST_FIRE/MUST_PASS)
        run: python3 checks/packaging_reachability.py --self-test
      - name: Packaging reachability (declared names must resolve)
        run: python3 checks/packaging_reachability.py

      # Countables drift (#220). The shipped documents state numbers ABOUT this
      # tree -- LOC, file counts -- and until now nothing kept them true; #220
      # found 9 drifted sites, 2 of which UNDERSTATED the repository.
      #
      # Three steps, in this order, for three different reasons:
      #
      #  1. --self-test first, same rule as the packaging gate above. The first
      #     version of this gate passed its own self-test while returning 865
      #     FALSE drifts on the real repository, because it inferred from
      #     proximity which countable each bare number claimed and no control
      #     exercised that association axis (#233). An uncontrolled axis is an
      #     unmeasured axis wearing a verdict, so the controls are the licence.
      #  2. The census is MEASURED here, never committed. A checked-in oracle
      #     would go stale the first time anyone touched the tree, and the gate
      #     would then enforce yesterday's numbers with full confidence -- it
      #     would not merely stop working, it would start lying.
      #  3. --no-coverage: the anchored patterns need LOC and file counts, none
      #     of which require a test run. The census CAN derive coverage keys,
      #     and the `check` job's pytest step is where those get measured;
      #     paying for a second suite run here would buy nothing this gate reads.
      #     The gate prints which census keys it can and cannot see, so the
      #     narrower census is visible in the output rather than assumed.
      - name: Countables drift controls (MUST_FIRE/MUST_PASS)
        run: python3 checks/countables_drift.py --self-test
      - name: Measure the countables census (the oracle, never committed)
        run: python3 tools/countables_census.py --no-coverage --out "$RUNNER_TEMP/census.json"
      - name: Countables drift (shipped numbers vs the measured tree)
        run: python3 checks/countables_drift.py --census "$RUNNER_TEMP/census.json" docs README.md

  launchers:
    name: launcher contracts (a silent suite fails this job)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax gate (bash -n over launchers/; zero files is a failure)
        # bash -n parses without executing, so this catches edit-time breakage
        # before the slower contract suite runs. find, not a glob: launchers/
        # holds subdirectories (the watchdog sub-suite among them), and a claim
        # about "every shell file" may not silently mean "every shell file at
        # depth 1" — a check narrower than its claim is a defect even when green.
        # The count is load-bearing twice: it is printed (a claim needs a
        # denominator) and zero matches fail the build, because a find that
        # matches nothing is UNMEASURED, never "all files are clean". The
        # refusal comes BEFORE any verdict line: "0 of 0 parse clean" must not
        # be emitted even on a path that fails a moment later, and a red run's
        # tally carries its rejection count inline so no line ever reads green
        # over red evidence.
        # Counters accumulate in the main shell via heredoc, never in a
        # `find | while` pipeline: on bash 3.2 (the macOS harness) the piped loop
        # is a subshell and both counters die with it — the gate would print 0/0,
        # the very vacuous read it exists to forbid. The increments are
        # `$((x + 1))` assignments, not `((x++))`: an arithmetic command whose
        # value is 0 returns exit 1, and under `bash -e` that kills the gate on
        # the first file it checks.
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ ! -d launchers ]; then
            echo "::error::launchers/ not found from $(pwd) — this gate must run from the"
            echo "::error::repository root. Missing is not zero: refusing, not reporting"
            echo "::error::0 files clean."
            exit 1
          fi
          files=$(find launchers -type f -name '*.sh' | sort)
          checked=0
          bad=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            checked=$((checked + 1))
            if ! bash -n "$f"; then
              bad=$((bad + 1))
              echo "::error::$f: bash -n failed (see parser output above)"
            fi
          done <<SYNTAX_FILES
          $files
          SYNTAX_FILES
          if [ "$checked" -eq 0 ]; then
            echo "::error::find launchers -type f -name '*.sh' matched zero files from $(pwd)."
            echo "::error::Zero examined files is UNMEASURED, not clean. If launchers/ moved,"
            echo "::error::move this gate with it in the same commit; if the files are gone,"
            echo "::error::the suite below has nothing to contract-test and must not pass either."
            exit 1
          fi
          echo "bash -n: $((checked - bad)) of $checked shell files under launchers/ parse clean ($bad rejected)"
          if [ "$bad" -ne 0 ]; then
            echo "::error::$bad of $checked shell files under launchers/ failed bash -n (named above)"
            exit 1
          fi
      - name: Run launcher contract suite (exit code checked, summary proven)
        # Invoked from the repository root and by relative path, on purpose.
        # Measured CWD-sensitivity: from inside launchers/, the watchdog
        # sub-suite resolves launchers/... against the caller and fails closed
        # with "0/8 launcher unreadable". cd "$GITHUB_WORKSPACE" pins the root
        # even if a job-level defaults.run.working-directory ever appears, and
        # the preflight -f check refuses with a named path rather than letting
        # a missing entry point read as zero controls run.
        #
        # The exit code is checked AND disbelieved. `bash script` exiting 0 says
        # the process ended, not that the floor's worth of controls ran — a suite killed before
        # its summary, or one whose summary print rotted away, must not be
        # creditable (a check over zero units proves nothing; ambiguous is
        # refused). So the captured output goes through verify_summary, which
        # requires the summary line, a zero failure count, and the control
        # denominator FLOOR declares below. Exit-code-only
        # wiring would look identical in the Actions log on the day the suite
        # starts exiting 0 early; that undetectable green is the fake this step
        # exists to refuse. Output is captured via $(...) rather than piped
        # through tee: no pipe, no pipefail question, the suite's real status
        # lands in rc untouched.
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ ! -f launchers/test_launcher_contracts.sh ]; then
            echo "::error::launchers/test_launcher_contracts.sh not found from $(pwd)."
            echo "::error::This step must run from the repository root (see step comment:"
            echo "::error::the suite is measured CWD-sensitive). A missing entry point is a"
            echo "::error::refusal — never zero controls, never a pass."
            exit 1
          fi

          # THE CONTROL FLOOR, AND THE ONLY PLACE IT IS WRITTEN.
          #
          # It was written in seven places: the comparison, its error message,
          # and five doctored fixtures that each embedded a count. Raising it
          # 150 -> 154 for #238 moved one of the seven, and the other six became
          # stale in the same edit. Two distinct failures followed, and only the
          # first is the kind a floor is supposed to produce:
          #
          #   * mustpass_4 carried `controls: 150 passed, 0 failed` as "the
          #     suite's real wording". Under a 154 floor verify_summary refuses
          #     it — correctly — and the leg printed "the reader cannot see its
          #     own producer ... that is #237 exactly". That message was FALSE.
          #     The reader saw its producer perfectly; the fixture was four
          #     controls short of a floor raised two edits earlier. A control
          #     that fires for a reason other than the one it names sends the
          #     next reader after the wrong defect, which is #90's shape: an
          #     unattributable red.
          #   * mustfire_2 and mustfire_5 exist to isolate the FAILURE-COUNT
          #     check ('1 failed' with the pass count intact). With their counts
          #     below the floor they fire for two reasons at once, so they no
          #     longer isolate anything — a confounded control still shows green
          #     and is worth nothing. Both are now built from FLOOR, so the
          #     failure count stays the only thing wrong with them.
          #
          # Fixtures 3 and 6 keep their literal 12: being below the floor IS
          # what they test, and deriving them would make them track the number
          # they are supposed to violate.
          #
          # The rule this encodes: a commit that adds or removes suite legs
          # re-measures the suite and edits ONE line here. If a number is worth
          # comparing against, it is worth having exactly one copy of.
          FLOOR=154

          verify_summary() {
            # Returns 0 only when the suite's summary line exists, reports
            # exactly 0 failures, and covers at least FLOOR controls. Every refusal
            # names what failed and echoes the offending line so the operator
            # can act. Accepts '<passed>/<total> ... <n> failed' or a bare
            # '<n> passed ... <n> failed'; if the suite rewords it beyond both,
            # THIS step must go red and be updated in the same commit —
            # unreadable is not empty. `set --` runs only after $1 is saved
            # into log, since it rebinds the function's positional parameters.
            #
            # THE LOCATOR IS THE BUG THIS COMMENT ONCE DESCRIBED (#237). It read
            #     grep -i 'summary'
            # while the suite's final line has the shape `controls: <n> passed,
            # 0 failed` — a shape carrying no such word,
            # which contains no such word. So `line` came back empty, the
            # function refused at the first branch, and this job was RED on
            # every run for 5+ commits over a suite that was 150/150 green.
            # Every parse branch below — including the bare-'<n> passed' branch
            # the old comment advertised — sat behind a word the emitter never
            # writes: the documented acceptance was unreachable, the claim
            # broader than the clause delivered (#104's shape).
            #
            # Read MUST_FIRE leg 2's comment below: "A checker that only greps
            # for the word 'summary' looks exactly like this from the outside".
            # That is precisely what this was, and leg 2 could not catch it
            # because leg 2's own fixture contains the word. All three doctored
            # fixtures were written in a shape the suite does not emit, so they
            # exercised a path the real log never took — a positive control
            # must plant the EXACT text the real producer writes and run the
            # EXACT matcher, or it certifies a different program. Legs 4-6 below
            # close that: they carry the suite's real wording verbatim.
            #
            # The locator now matches EITHER the literal word (kept so a future
            # reworded 'SUMMARY:' line still lands) OR the semantic shape the
            # parser actually needs: a pass count and a failure count on one
            # line. It is still strictly fail-closed — no match is a refusal.
            local log=$1 line frac failed passed_n passed total
            line=$(printf '%s\n' "$log" \
              | { grep -iE 'summary|[0-9]+[[:space:]]*(passed|green)[^0-9]+[0-9]+[[:space:]]*failed' || true; } \
              | tail -n 1)
            if [ -z "$line" ]; then
              echo "::error::no summary line in suite output — a run that never" >&2
              echo "::error::prints its summary has measured nothing CI may credit." >&2
              return 1
            fi
            frac=$(printf '%s\n' "$line" | { sed -n 's/[^0-9]*\([0-9][0-9]*\)\/\([0-9][0-9]*\).*/\1 \2/p' || true; } | head -n 1)
            failed=$(printf '%s\n' "$line" | { sed -n 's/.*[^0-9]\([0-9][0-9]*\)[[:space:]]*failed.*/\1/p' || true; } | head -n 1)
            passed_n=$(printf '%s\n' "$line" | { sed -n 's/[^0-9]*\([0-9][0-9]*\)[[:space:]]*passed.*/\1/p' || true; } | head -n 1)
            if [ -n "$frac" ]; then
              set -- $frac
              passed=$1
              total=$2
              if [ "$passed" != "$total" ]; then
                echo "::error::summary reads $passed of $total green — not all controls passed:" >&2
                echo "::error::$line" >&2
                return 1
              fi
            elif [ -n "$passed_n" ]; then
              total=$passed_n
            else
              echo "::error::summary carries no parseable pass count" >&2
              echo "::error::('<passed>/<total>' or '<n> passed'): $line" >&2
              return 1
            fi
            if [ -z "$failed" ]; then
              echo "::error::summary names no failure count ('<n> failed'): $line" >&2
              return 1
            fi
            if [ "$((10#$failed))" -ne 0 ]; then
              echo "::error::summary reports $failed failed control(s): $line" >&2
              return 1
            fi
            # Floor history: 134 (when this gate was written) -> 150 (#237, the
            # day the locator was fixed) -> 154 (#238, once countables_drift.py
            # and packaging_reachability.py were wired in as four real legs). A
            # floor below the live count lets that many controls vanish in
            # silence, which is the same quiet-shrink move the floor exists to
            # refuse. The value itself is FLOOR, set once at the top of this
            # step; see the comment there for why it is not written twice.
            if [ "$((10#$total))" -lt "$FLOOR" ]; then
              echo "::error::summary covers $total controls; $FLOOR were measured when this" >&2
              echo "::error::gate was written. A quietly shrunk suite is the empty-registry" >&2
              echo "::error::move, one directory down. Remove controls on purpose and lower" >&2
              echo "::error::this floor in the same commit — or not at all." >&2
              return 1
            fi
            return 0
          }

          # MUST_FIRE legs for verify_summary itself — broken to see red. A
          # summary checker that has never been observed refusing is not a
          # control, so three deliberately doctored logs must each be rejected
          # before the real output is trusted. Mutations: (1) the summary line
          # deleted — the dies-early green; (2) the summary rewritten to
          # '1 failed' with the pass count at FLOOR so the failure count is the
          # only thing wrong with it; (3) the summary shrunk to '12/12, 0 failed'
          # — the silently-emptied suite that only the floor catches. Refusals go
          # to /dev/null so the expected reds do not pollute the annotation
          # stream.
          mustfire_1=$'launchers: 8/8 watchdog checks green\ncontracts: 126/126 green'
          mustfire_2="SUMMARY: $FLOOR/$FLOOR controls passed, 1 failed"
          mustfire_3='SUMMARY: 12/12 controls passed, 0 failed'
          if verify_summary "$mustfire_1" 2>/dev/null; then
            echo "::error::summary verifier ACCEPTED doctored log 1 (mutation: summary"
            echo "::error::line deleted). It must refuse a full run's worth of output that"
            echo "::error::has no summary; as written it is a no-op stamp. Trust no green."
            exit 1
          fi
          if verify_summary "$mustfire_2" 2>/dev/null; then
            echo "::error::summary verifier ACCEPTED doctored log 2 (mutation: '1 failed')."
            echo "::error::A checker that only greps for the word 'summary' looks exactly"
            echo "::error::like this from the outside — that fake is why this leg exists."
            exit 1
          fi
          if verify_summary "$mustfire_3" 2>/dev/null; then
            echo "::error::summary verifier ACCEPTED doctored log 3 (mutation: suite shrunk"
            echo "::error::to 12/12). The $FLOOR-control floor is decorative without this leg."
            exit 1
          fi
          echo "verify_summary fired on all three doctored logs (MUST_FIRE legs 1-3) — proven able to refuse."
          # ------------------------------------------------------------------
          # Legs 4-6 (#237): the axis legs 1-3 never touched — CAN THIS READER
          # SEE ITS OWN PRODUCER? Legs 1-3 are all written as
          # 'SUMMARY: <n>/<n> controls passed, <n> failed', a shape
          # launchers/test_launcher_contracts.sh has never emitted. Three legs
          # can be green over a format the real suite does not produce, and were
          # for 5+ commits while the real path refused a 150/150 run. Proving a
          # detector refuses garbage says nothing about whether it can read the
          # one input it exists to read.
          #
          # So these carry the suite's ACTUAL final line shape verbatim —
          # `controls: <n> passed, 0 failed`, with <n> taken from FLOOR so the
          # fixture can never fall below the bar it is being measured against —
          # and drive it through the SAME
          # verify_summary the real log goes through. If the suite rewords its
          # tally, leg 4 goes red HERE, naming the reader/producer split, rather
          # than the job failing downstream with "no summary line" and being
          # read as a suite failure.
          #
          # 4 is MUST_PASS (the reader sees the producer). 5 and 6 are MUST_FIRE
          # in that same real shape, so the failure-count and floor checks are
          # proven reachable THROUGH the new locator and not only through the
          # legacy 'summary' word.
          # ------------------------------------------------------------------
          mustpass_4="controls: $FLOOR passed, 0 failed"
          mustfire_5="controls: $FLOOR passed, 1 failed"
          mustfire_6='controls: 12 passed, 0 failed'
          if ! verify_summary "$mustpass_4"; then
            echo "::error::summary verifier REFUSED the suite's real summary line"
            echo "::error::('$mustpass_4'). The reader cannot see its own producer —"
            echo "::error::that is #237 exactly, and it makes every green below unearned."
            echo "::error::Reconcile the locator with launchers/test_launcher_contracts.sh"
            echo "::error::in this commit; do NOT relax the checks underneath it."
            exit 1
          fi
          if verify_summary "$mustfire_5" 2>/dev/null; then
            echo "::error::summary verifier ACCEPTED doctored log 5 ('1 failed' in the"
            echo "::error::suite's REAL wording). The failure-count check is reachable via"
            echo "::error::the legacy 'summary' word but not via the line actually emitted."
            exit 1
          fi
          if verify_summary "$mustfire_6" 2>/dev/null; then
            echo "::error::summary verifier ACCEPTED doctored log 6 (suite shrunk to 12,"
            echo "::error::in the REAL wording). The control floor is decorative on the"
            echo "::error::only line shape this job will ever actually parse."
            exit 1
          fi
          echo "verify_summary read the suite's real summary shape and refused both of its mutations (legs 4-6) — the reader is proven able to see its own producer."
          # ------------------------------------------------------------------
          # Leg WF-YAML (control for the BLOCKER-1 class). One column-zero line
          # inside a block scalar killed this entire file; dead file -> zero
          # jobs -> nothing else could go red. This leg audits EVERY workflow
          # file (*.yml AND *.yaml) from the verify job: the count is on the
          # wire, 0 examined is RED (doctrine 1), unreadable is RED (doctrine
          # 4), and the parser mode is named on the wire -- the structural
          # fallback labels itself NOT a full parse (doctrine 5). MUST_FIRE:
          # checks/wf_yaml_audit.py --doctor-blocker1 rebuilds BLOCKER 1
          # verbatim on a copy of ci.yml (failing closed if the fixed needle is
          # gone) and the audit must refuse the copy (doctrine 3). Plain limit:
          # when ci.yml itself is the corpse, workflow-startup failure is the
          # alarm -- no leg inside a dead workflow can run; this covers every
          # push that starts and every sibling file.
          # ------------------------------------------------------------------
          repo_root=${GITHUB_WORKSPACE:-$PWD}
          WORKFLOW_DIR=$repo_root/.github/workflows
          LORA_LP=$repo_root/launchers/launch_g4e4b_lora_1tray.sh
          FULL_LP=$repo_root/launchers/launch_g4e4b_fullft_1tray.sh
          if [ ! -d "$WORKFLOW_DIR" ]; then
            echo "::error::WF-YAML leg cannot see $WORKFLOW_DIR -- a gate that cannot reach its target is RED, never vacuous (doctrines 1 and 4)."
            exit 1
          fi
          if [ ! -r "$repo_root/checks/wf_yaml_audit.py" ] || [ ! -r "$repo_root/checks/bash_lc_sweep.py" ]; then
            echo "::error::control scripts unreadable under $repo_root/checks -- missing is not zero (doctrine 4); refusing to run blind."
            exit 1
          fi
          # NOT mapfile. It is a bash 4+ builtin and macOS ships bash 3.2, where
          # the line dies `mapfile: command not found` and -- under this step's
          # `set -e`-less prologue -- leaves wf_files EMPTY. The guard below
          # would then report "0 workflow files, UNMEASURED", which is true of
          # the array and false of the directory: an accurate-sounding verdict
          # about the wrong subject. The runner has bash 5, so CI never saw it;
          # the only machine that did was the developer laptop this step must be
          # reproducible on, which is where the whole step was being replayed to
          # debug #237. The read loop below is identical on bash 3.2 and 5.
          # The same rule is already written down at
          # h100_validation/build_h100_plane.sh:580 -- it was applied there and
          # not here, which is how a convention becomes one file's habit.
          wf_files=()
          while IFS= read -r wf_f; do
            wf_files+=("$wf_f")
          done < <(find "$WORKFLOW_DIR" -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          if [ ${#wf_files[@]} -eq 0 ]; then
            echo "::error::WF-YAML found 0 *.yml/*.yaml under $WORKFLOW_DIR -- zero units is UNMEASURED, not a pass (doctrine 1)."
            exit 1
          fi
          echo "WF-YAML MUST_PASS: auditing ${#wf_files[@]} workflow file(s); the count is on the wire."
          if ! python3 "$repo_root/checks/wf_yaml_audit.py" "${wf_files[@]}"; then
            echo "::error::WF-YAML leg RED on the live tree -- refusing to stamp dead workflows."
            exit 1
          fi
          mustfire_wf_dir=$(mktemp -d)
          if ! cp "$WORKFLOW_DIR/ci.yml" "$mustfire_wf_dir/ci-doctored.yml"; then
            echo "::error::WF-YAML MUST_FIRE setup could not copy ci.yml -- a control that never runs is not a control (doctrine 3)."
            exit 1
          fi
          if ! python3 "$repo_root/checks/wf_yaml_audit.py" --doctor-blocker1 "$mustfire_wf_dir/ci-doctored.yml"; then
            echo "::error::WF-YAML MUST_FIRE setup failed -- could not rebuild BLOCKER 1 on a copy; the control cannot prove itself (doctrine 3)."
            exit 1
          fi
          if python3 "$repo_root/checks/wf_yaml_audit.py" "$mustfire_wf_dir/ci-doctored.yml" >/dev/null 2>&1; then
            echo "::error::WF-YAML MUST_FIRE leg failed: the audit ACCEPTED a copy doctored with BLOCKER 1's exact column-zero shape."
            echo "::error::A checker that accepts what killed CI is a stamp, not a control (doctrine 3)."
            exit 1
          fi
          echo "WF-YAML MUST_FIRE ok: doctored copy went red -- the checker is proven able to refuse."
          rm -rf "$mustfire_wf_dir"
          # ------------------------------------------------------------------
          # Leg BASH-LC (control for the BLOCKER-2 class). Splicing a path
          # variable into an inner shell's SOURCE text is an injection hatch:
          # whitespace word-splits (false red on a healthy request) and $(...)
          # text executes. The fix passes the path as DATA ($1). The sweep
          # classifies EVERY bash -lc site in BOTH launchers; the site count and
          # every site go on the wire; 0 sites is a broken sweep, not a pass
          # (doctrine 1); an unreadable launcher is RED, not skipped (doctrine
          # 4). MUST_FIRE reinstates BLOCKER 2's exact line on a copy and
          # demands red (doctrine 3). Output deliberately avoids the
          # green/passed/SUMMARY tokens and suite domain prefixes so
          # verify_summary cannot mis-ingest it.
          # ------------------------------------------------------------------
          # Self-test FIRST, exactly like the `packaging` job's two steps: a
          # detector whose own controls misbehave has no licence to report a
          # verdict, so the live sweep must not be reachable without it. This
          # ordering is load-bearing here and not merely tidy -- #239 widened
          # the sweep three times (eval-shaped source, %q-rendered
          # substitution, declared splice), and every widening is a shape it
          # will now decline to report. The 9 MUST_FIREs are what keep those
          # exemptions narrow: eval-shaped is exempt and eval-shaped-plus-one-
          # word is not, %q-rendered is exempt and plain printf is not, comment
          # text is not a site and a `#` inside the quoted source still is. A
          # declaration that stops matching the tree is RED, which is the only
          # thing separating DECLARED_SPLICES from an allowlist.
          if ! python3 "$repo_root/checks/bash_lc_sweep.py" --self-test; then
            echo "::error::BASH-LC self-test RED -- the sweep's own controls misbehaved, so its verdict on the live tree states nothing (doctrine 3)."
            exit 1
          fi
          for lp_file in "$LORA_LP" "$FULL_LP"; do
            if [ ! -r "$lp_file" ]; then
              echo "::error::BASH-LC cannot read $lp_file -- unreadable is not empty; the sweep refuses to green a launcher it cannot see (doctrine 4)."
              exit 1
            fi
          done
          if ! python3 "$repo_root/checks/bash_lc_sweep.py" "$LORA_LP" "$FULL_LP"; then
            echo "::error::BASH-LC leg RED on the live tree -- an unsafe splice is a defect even when the rendered command happens to work (doctrine 5, symmetric)."
            exit 1
          fi
          mustfire_lp=$(mktemp)
          if ! python3 "$repo_root/checks/bash_lc_sweep.py" --reinstate-blocker2 "$FULL_LP" "$mustfire_lp"; then
            echo "::error::BASH-LC MUST_FIRE setup failed -- the fixed probe line is missing or not unique; the sweep cannot prove itself (doctrine 3)."
            exit 1
          fi
          if python3 "$repo_root/checks/bash_lc_sweep.py" "$LORA_LP" "$mustfire_lp" >/dev/null 2>&1; then
            echo "::error::BASH-LC MUST_FIRE leg failed: the sweep ACCEPTED the reinstated BLOCKER-2 line."
            echo "::error::A sweep that cannot see its namesake defect is decoration -- trust no green from it (doctrine 3)."
            exit 1
          fi
          echo "BASH-LC MUST_FIRE ok: reinstated unsafe splice on the copy went red."
          rm -f "$mustfire_lp"
          echo "Both new standing legs (WF-YAML, BASH-LC) hold -- and both controls were OBSERVED refusing before this stamp."

          set +e
          output=$(bash launchers/test_launcher_contracts.sh 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then
            echo "::error::launchers/test_launcher_contracts.sh exited $rc from the"
            echo "::error::repository root; suite output above. (From any other directory"
            echo "::error::this same command fails closed with '0/8 launcher unreadable'"
            echo "::error::— that refusal is the watchdog working, not a bug to retry.)"
            exit 1
          fi
          if ! verify_summary "$output"; then
            echo "::error::The suite exited 0, but exit 0 is not evidence that $FLOOR"
            echo "::error::controls ran. The required proof is the summary line above —"
            echo "::error::missing, unreadable, or red, this run is UNMEASURED and refused."
            exit 1
          fi
          # MUST_PASS leg, observed live: the real suite's summary accepted.
          # The summary line is reprinted as the claim, denominator included —
          # "the guard works" is not a claim, "$FLOOR of $FLOOR carry it" is.
          printf 'launcher contracts green, verified summary: '
          printf '%s\n' "$output" | { grep -i 'summary' || true; } | tail -n 1

  mutation:
    name: mutation testing (a surviving mutant fails this job)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Mutant trials inherit this: a mutant that flips a test into "skipped"
      # must be killed, not scored as survived. tools/mutate.py runs the suite
      # with the same environment CI uses.
      FS_FORBID_SKIPS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[checkpoint,dev]" "pytest-cov>=5" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run mutation tests
        # tools/mutate.py (task 2 of this batch) exits nonzero if any mutant
        # survives. No continue-on-error, no filtering: the survivor count is
        # the signal and it fails this job directly.
        run: python tools/mutate.py
